- type: entity
  parent: [ IDCardStandard, BaseSyndicateContraband ]
  id: SyndiTaipanTelecommunicationsOfficerIDCard
  name: ID карта офицера телекоммуникаций тайпана/DS-2 #Наименование карты в списке
  components:
  - type: IdCard
    jobTitle: Telecommunications Officer Taipan #Должность при осмотре
    jobIcon: JobIconTelecommunicationsOfficer
  - type: Sprite
    layers:
    - state: black
    - state: stripe_top
      color: &color-syndicate-top "#e80c0c"
    - state: stripe_bottom
      color: &color-syndicate-bottom "#960606"
    - sprite: _Adventure/Interface/Misc/job_icons.rsi
      offset: &icon-offset -0.09375, 0.0625
      state: trim_ds2admiral
  - type: Access
    groups:
      - AllAccess
    tags:
      - SyndicateAgent #По запросу синди доступ выдан главам и СБ (тайпан)
      - NuclearOperative
      
