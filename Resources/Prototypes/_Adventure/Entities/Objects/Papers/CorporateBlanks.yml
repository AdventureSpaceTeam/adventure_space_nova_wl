- type: entity
  name: AzaraBlank
  parent: Paper
  id: AzaraBlank
  description: "Бланк, используемый корпорацией Азара Клининг."
  components:
  - type: Sprite
    layers:
    - state: paper
      color: "#8bbee9"
    - state: paper_words
      map: ["enum.PaperVisualLayers.Writing"]
      color: "#8bbee9"
      visible: false
    - state: paper_stamp-generic
      map: ["enum.PaperVisualLayers.Stamp"]
      visible: false
  - type: PaperLabelType
    paperType: CaptainsPaper
  - type: PaperVisuals
    headerImagePath: "/Textures/_Adventure/Objects/Papers/Blanks/AzaraBlank.png"
    backgroundImagePath: "/Textures/Interface/Paper/paper_background_default.svg.96dpi.png"
    backgroundModulate: "#8bbee9"
    backgroundPatchMargin: 16.0, 16.0, 16.0, 16.0
    contentMargin: 32.0, 16.0, 32.0, 0.0

